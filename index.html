const $ = id =&gt; document.getElementById(id);
let p, e, defending, over;

function init(){
  p = {lv:1, exp:0, gold:10, potion:3, hp:100, mhp:100, mp:30};
  newBattle(true);
}
function newBattle(first){
  e = {hp:60};
  over = false;
  if(!first &amp;&amp; p.hp &lt;= 0){ p.hp = p.mhp; p.mp = 30; }

  $(&#x27;state&#x27;).textContent = &#x27;야생 슬라임이 나타났다!&#x27;;
  if(first) $(&#x27;log&#x27;).innerHTML=&#x27;&#x27;;
  log(&#x27;전투 시작&#x27;);
  render();
}
function log(t){ const li=document.createElement(&#x27;li&#x27;); li.textContent=t; $(&#x27;log&#x27;).prepend(li); }
function render(){
  $(&#x27;lv&#x27;).textContent=p.lv; $(&#x27;exp&#x27;).textContent=p.exp; $(&#x27;gold&#x27;).textContent=p.gold; $(&#x27;potion&#x27;).textContent=p.potion;
  $(&#x27;hp&#x27;).textContent=p.hp; $(&#x27;mhp&#x27;).textContent=p.mhp; $(&#x27;mp&#x27;).textContent=p.mp; $(&#x27;ehp&#x27;).textContent=e.hp;
  $(&#x27;hpb&#x27;).style.width=Math.max(0,p.hp/p.mhp*100)+&#x27;%&#x27;;
  $(&#x27;mpb&#x27;).style.width=Math.max(0,p.mp/30*100)+&#x27;%&#x27;;
  $(&#x27;ehpb&#x27;).style.width=Math.max(0,e.hp/60*100)+&#x27;%&#x27;;
}

function enemyTurn(){
  let dmg = 8 + Math.floor(Math.random()*7);
  if(defending) dmg = Math.floor(dmg/2);
  p.hp -= dmg;
  log(&#x27;슬라임의 공격! &#x27;+dmg+&#x27; 피해&#x27;);
  if(p.hp &lt;= 0){ $(&#x27;state&#x27;).textContent=&#x27;패배...&#x27;; log(&#x27;패배했습니다.&#x27;); over = true; }
}

function checkWin(){
  if(e.hp &lt;= 0){
    $(&#x27;state&#x27;).textContent=&#x27;승리!&#x27;;
    p.gold += 20; p.exp += 30;
    log(&#x27;슬라임 처치! 골드 +20, EXP +30&#x27;);
    if(p.exp &gt; 100){
      p.lv++; p.exp = 0; p.mhp += 10;
      log(&#x27;레벨 업! Lv.&#x27;+p.lv);
    }
    over = true;
  }
}

function act(fn){
  if(over){ log(&#x27;전투가 끝났습니다. 새 전투를 시작하세요.&#x27;); return; }
  fn();
  checkWin();
  enemyTurn();
  render();
}

$(&#x27;atk&#x27;).onclick = () =&gt; act(() =&gt; {
  const d = 10 + Math.floor(Math.random()*6);
  e.hp -= d; log(&#x27;공격! &#x27;+d+&#x27; 피해&#x27;);
});
$(&#x27;skill&#x27;).onclick = () =&gt; act(() =&gt; {
  if(p.mp &lt;= 0){ log(&#x27;MP가 부족합니다.&#x27;); return; }
  p.mp -= 10;
  e.hp -= 20;
  log(&#x27;스킬 발동! 25 피해&#x27;);
});
$(&#x27;def&#x27;).onclick = () =&gt; act(() =&gt; { defending = true; log(&#x27;방어 자세&#x27;); });
$(&#x27;pot&#x27;).onclick = () =&gt; act(() =&gt; {
  p.potion--;
  p.hp += 30;
  log(&#x27;포션 사용! HP +30&#x27;);
});
$(&#x27;buy&#x27;).onclick = () =&gt; {
  if(p.gold &gt; 15){ p.gold -= 15; p.potion++; log(&#x27;포션 구매&#x27;); }
  else log(&#x27;골드가 부족합니다.&#x27;);
  render();
};
$(&#x27;next&#x27;).onclick = () =&gt; { if(p.hp &lt;= 0){ init(); } else newBattle(false); };

init();

</div>
<script>
const desc = ['원본 버전: 결함이 포함된 상태입니다.', '수정 버전(v2): 원본에서 발견한 결함을 수정한 상태입니다. 회귀 테스트 대상입니다.'];
let cur = 0;
function show(i){
  cur = i;
  [0,1].forEach(n=>{
    document.getElementById('f'+n).classList.toggle('on', n===i);
    document.getElementById('t'+n).setAttribute('aria-selected', n===i);
  });
  document.getElementById('desc').textContent = desc[i];
}
document.getElementById('t0').onclick = ()=>show(0);
document.getElementById('t1').onclick = ()=>show(1);
document.getElementById('reset').onclick = ()=>{
  const f = document.getElementById('f'+cur), s = f.srcdoc;
  f.srcdoc = ''; f.srcdoc = s;
};
show(0);
</script>
</body>
</html>
